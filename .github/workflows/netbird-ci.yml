name: NetBird Persistent Runner with VNC

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  netbird-persistent-runner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =============================================
      # Install and connect NetBird
      # =============================================
      - name: Install NetBird
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update -y
          sudo apt-get install -y netbird

      - name: Connect to NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          sudo netbird up --setup-key $NETBIRD_SETUP_KEY --allow-server-ssh &
          sleep 5
          echo "✅ NetBird connected!"
          sudo netbird status

      # =============================================
      # Setup SSH with root login
      # =============================================
      - name: Setup SSH server
        run: |
          sudo apt-get install -y openssh-server
          echo "root:root" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo service ssh restart
          echo "✅ SSH configured with root/root"

      - name: Enable NetBird SSH
        run: |
          sudo netbird up --allow-server-ssh
          echo "🔑 NetBird SSH enabled"

      # =============================================
      # Setup VNC with x11vnc (MORE RELIABLE)
      # =============================================
      - name: Install VNC and desktop
        run: |
          sudo apt-get update -y
          sudo apt-get install -y x11vnc xvfb xfce4 xfce4-goodies dbus-x11 x11-utils
          echo "✅ VNC packages installed"

      - name: Setup virtual display
        run: |
          # Create virtual display
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          echo "✅ Virtual display :99 created"

      - name: Start desktop environment
        run: |
          export DISPLAY=:99
          # Start XFCE in background
          startxfce4 &
          sleep 5
          echo "✅ Desktop environment started"

      - name: Start x11vnc server
        run: |
          export DISPLAY=:99
          # Start x11vnc with password
          x11vnc -display :99 -forever -nopw -passwd root -shared -listen 0.0.0.0 &
          sleep 3
          echo "✅ x11vnc started on port 5900"

      - name: Verify VNC is running
        run: |
          echo "VNC Processes:"
          ps aux | grep -E "vnc|Xvfb|xfce" | grep -v grep || echo "No process found"
          echo ""
          netstat -tlnp | grep 5900 || echo "Port 5900 not listening"

      # =============================================
      # Alternative: Start TigerVNC with minimal config
      # =============================================
      - name: Start TigerVNC as fallback
        if: failure()
        run: |
          sudo apt-get install -y tigervnc-standalone-server
          mkdir -p ~/.vnc
          echo "root" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # Simple xterm-based VNC
          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/sh
          xrdb $HOME/.Xresources
          xsetroot -solid grey
          x-terminal-emulator -geometry 80x24+10+10 -ls -title "$VNCDESKTOP Desktop" &
          x-window-manager &
          EOF
          chmod +x ~/.vnc/xstartup
          
          vncserver :1 -geometry 1920x1080 -depth 24
          echo "✅ Fallback VNC started"

      # =============================================
      # Open firewall ports
      # =============================================
      - name: Configure firewall
        run: |
          sudo ufw allow 22/tcp || true
          sudo ufw allow 44338/tcp || true
          sudo ufw allow 5900/tcp || true
          sudo ufw allow 5901/tcp || true
          echo "✅ Firewall configured"

      # =============================================
      # Keep alive and show connection info
      # =============================================
      - name: Connection Info
        run: |
          echo "=========================================="
          echo "🔗 NETBIRD RUNNER READY"
          echo "=========================================="
          echo ""
          sudo netbird status
          echo ""
          NETBIRD_IP=$(sudo netbird status | grep "NetBird IP" | awk '{print $NF}')
          echo "📡 NetBird IP: $NETBIRD_IP"
          echo ""
          echo "🔑 SSH CONNECTION:"
          echo "  ssh root@$NETBIRD_IP"
          echo "  Password: root"
          echo ""
          echo "🔑 SSH VIA NETBIRD:"
          echo "  ssh -p 44338 root@$NETBIRD_IP"
          echo "  Password: root"
          echo ""
          echo "🖥️ VNC CONNECTION:"
          echo "  vncviewer $NETBIRD_IP:0 (for x11vnc)"
          echo "  Password: root"
          echo "  OR"
          echo "  vncviewer $NETBIRD_IP:1 (for TigerVNC)"
          echo "  Password: root"
          echo "=========================================="
          echo ""
          echo "⏳ Keeping runner alive for 60 minutes..."

      - name: Keep alive
        run: |
          sleep 3600
          echo "⏰ Timeout reached"

      # =============================================
      # Cleanup
      # =============================================
      - name: Cleanup
        if: always()
        run: |
          pkill -f Xvfb || true
          pkill -f x11vnc || true
          vncserver -kill :1 || true
          sudo netbird down || true
          echo "🧹 Cleanup complete"
