# This pipeline runs a job on a GitLab Runner with Ubuntu 26.04 LTS.
# It installs NetBird and connects using a provided setup key.

stages:
  - test-connection

netbird-connect-job:
  stage: test-connection
  tags:
    - ubuntu-26.04
  image: ubuntu:26.04
  script:
    - echo "Updating package list..."
    - apt-get update -y

    - echo "Installing prerequisites for NetBird..."
    - apt-get install -y ca-certificates curl gnupg

    - echo "Adding the NetBird APT repository..."
    - curl -sSL https://pkgs.netbird.io/debian/public.key | gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
    - echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | tee /etc/apt/sources.list.d/netbird.list

    - echo "Installing NetBird client..."
    - apt-get update -y
    - apt-get install -y netbird

    - echo "Connecting to NetBird network in foreground mode..."
    - netbird up --setup-key $NETBIRD_SETUP_KEY --daemon &

    - echo "Waiting for daemon to start..."
    - sleep 5

    - echo "Checking connection status..."
    - netbird status

  variables:
    NETBIRD_SETUP_KEY: $NETBIRD_SETUP_KEY
