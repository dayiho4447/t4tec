name: Ubuntu VPS - TurboVNC GNOME

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      # ============================================
      # 1. INSTALL NETBIRD
      # ============================================
      - name: Install NetBird
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update -y
          sudo apt-get install -y netbird

      # ============================================
      # 2. CONNECT NETBIRD
      # ============================================
      - name: Connect NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          sudo netbird up --setup-key $NETBIRD_SETUP_KEY --allow-server-ssh &
          sleep 5
          sudo netbird status

      # ============================================
      # 3. CONFIGURE NETWORKMANAGER
      # ============================================
      - name: Configure NetworkManager
        run: |
          sudo mkdir -p /etc/NetworkManager/conf.d
          sudo tee /etc/NetworkManager/conf.d/99-netbird-unmanaged.conf << 'EOF'
          [keyfile]
          unmanaged-devices=interface-name:wt0
          EOF
          sudo systemctl restart NetworkManager 2>/dev/null || true
          sudo systemctl mask systemd-networkd-wait-online 2>/dev/null || true

      # ============================================
      # 4. INSTALL GNOME + TURBOVNC
      # ============================================
      - name: Install GNOME, RDP, and TurboVNC
        run: |
          sudo apt-get update -y

          # Install GNOME and RDP (same as before)
          sudo apt-get install -y \
            ubuntu-desktop-minimal \
            gnome-session \
            gnome-shell \
            gnome-terminal \
            nautilus \
            gnome-tweaks \
            gnome-control-center \
            xrdp \
            openssh-server \
            dbus-x11 \
            policykit-1 \
            net-tools \
            iputils-ping \
            dnsutils \
            traceroute \
            curl \
            wget \
            iperf3 \
            tcpdump \
            nmap \
            mtr \
            whois \
            telnet \
            netcat-openbsd \
            socat \
            bridge-utils \
            ethtool \
            conntrack \
            iptables \
            nftables \
            openvpn \
            wireguard \
            rsync \
            screen \
            tmux \
            htop \
            ncdu \
            git \
            vim \
            --no-install-recommends

          # Download and install the latest TurboVNC .deb package
          # Find latest version from: https://github.com/TurboVNC/turbovnc/releases
          TURBOVNC_VERSION="3.3-20260206"  # Update this to the latest version if needed
          wget -O /tmp/turbovnc_${TURBOVNC_VERSION}_amd64.deb \
            https://github.com/TurboVNC/turbovnc/releases/download/${TURBOVNC_VERSION}/turbovnc_${TURBOVNC_VERSION}_amd64.deb
          sudo apt-get install -y /tmp/turbovnc_${TURBOVNC_VERSION}_amd64.deb

      # ============================================
      # 5. CONFIGURE SSH
      # ============================================
      - name: Configure SSH
        run: |
          echo "root:root" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      # ============================================
      # 6. CONFIGURE RDP
      # ============================================
      - name: Configure RDP (xRDP → GNOME)
        run: |
          sudo useradd -m -s /bin/bash rdpuser 2>/dev/null || true
          echo "rdpuser:root" | sudo chpasswd
          sudo usermod -aG sudo rdpuser

          sudo tee /etc/xrdp/startwm.sh > /dev/null << 'EOF'
          #!/bin/sh
          . /etc/profile
          export HOME=/home/rdpuser
          export XDG_CURRENT_DESKTOP="GNOME"
          export XDG_MENU_PREFIX="gnome-"
          export GNOME_SHELL_SESSION_MODE="ubuntu"
          exec gnome-session
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh
          sudo systemctl restart xrdp
          sudo systemctl enable xrdp

      # ============================================
      # 7. CONFIGURE TURBOVNC ON PORT 5901
      # ============================================
      - name: Configure TurboVNC (port 5901)
        run: |
          # Create rdpuser if not exists
          sudo useradd -m -s /bin/bash rdpuser 2>/dev/null || true
          echo "rdpuser:root" | sudo chpasswd
          sudo usermod -aG sudo rdpuser

          # Set the VNC password for rdpuser
          echo "root" | sudo -u rdpuser /opt/TurboVNC/bin/vncpasswd -f > /home/rdpuser/.vnc/passwd
          sudo chmod 600 /home/rdpuser/.vnc/passwd
          sudo chown -R rdpuser:rdpuser /home/rdpuser/.vnc

          # Create the xstartup script for GNOME
          sudo -u rdpuser tee /home/rdpuser/.vnc/xstartup > /dev/null << 'EOF'
          #!/bin/sh
          export XDG_CURRENT_DESKTOP="GNOME"
          export XDG_MENU_PREFIX="gnome-"
          export GNOME_SHELL_SESSION_MODE="ubuntu"
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec gnome-session
          EOF
          sudo -u rdpuser chmod +x /home/rdpuser/.vnc/xstartup

          # Start TurboVNC on display :1 (port 5901)
          sudo -u rdpuser /opt/TurboVNC/bin/vncserver :1 -geometry 1920x1080 -depth 24 -localhost no

          echo "✅ TurboVNC is running on display :1 (port 5901)"

      # ============================================
      # 8. VERIFY SERVICES
      # ============================================
      - name: Verify Services
        run: |
          echo "=== SSH ==="
          sudo systemctl status ssh --no-pager | head -3
          echo ""
          echo "=== xRDP ==="
          sudo systemctl status xrdp --no-pager | head -3
          echo ""
          echo "=== TurboVNC ==="
          /opt/TurboVNC/bin/vncserver -list
          echo ""
          echo "=== NetBird ==="
          sudo netbird status

      # ============================================
      # 9. CONNECTION INFO
      # ============================================
      - name: Connection Info
        run: |
          IP=$(sudo netbird status | grep "NetBird IP" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "=========================================="
          echo "✅ UBUNTU VPS - TURBOVNC + GNOME"
          echo "=========================================="
          echo ""
          echo "📡 NetBird IP: $IP"
          echo ""
          echo "🔑 SSH (port 22):"
          echo "  ssh root@$IP"
          echo "  Password: root"
          echo ""
          echo "🖥️ xRDP (port 3389):"
          echo "  Address: $IP:3389"
          echo "  User: rdpuser"
          echo "  Password: root"
          echo ""
          echo "🖥️ TurboVNC (port 5901):"
          echo "  vncviewer $IP:5901"
          echo "  Password: root"
          echo ""
          echo "📦 Network Tools: net-tools, ping, dig, traceroute"
          echo "  curl, wget, iperf3, tcpdump, nmap, mtr"
          echo "  telnet, netcat, openvpn, wireguard"
          echo "  screen, tmux, htop, git, vim"
          echo ""
          echo "🔧 NetworkManager: RUNNING - wt0 UNMANAGED"
          echo "⏱️ Server runs for 6 HOURS"
          echo "=========================================="

      # ============================================
      # 10. KEEP ALIVE
      # ============================================
      - name: Keep Alive (6 hours)
        run: |
          echo "=========================================="
          echo "🚀 SERVER RUNNING - TURBOVNC MODE"
          echo "=========================================="
          echo ""
          echo "✅ NetBird: CONNECTED"
          echo "✅ SSH: ACTIVE (root/root)"
          echo "✅ xRDP: ACTIVE (GNOME on 3389)"
          echo "✅ TurboVNC: ACTIVE (GNOME on 5901)"
          echo "✅ Network Tools: INSTALLED"
          echo ""
          echo "⏳ Keeping alive for 6 hours..."
          tail -f /dev/null
