name: NetBird Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-connection:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update package list
        run: sudo apt-get update -y

      - name: Install prerequisites
        run: |
          sudo apt-get install -y ca-certificates curl gnupg

      - name: Add NetBird APT repository
        run: |
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list

      - name: Install NetBird client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netbird

      - name: Connect to NetBird network
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          sudo netbird up --setup-key $NETBIRD_SETUP_KEY &
          sleep 5

      - name: Check connection status
        run: sudo netbird status

      - name: Verify Python is available
        run: |
          python3 --version
          echo "✅ Python environment ready"

      - name: Test network connectivity
        run: |
          echo "📡 Network interfaces:"
          ip addr show | grep inet
          
  build-and-test:
    runs-on: ubuntu-latest
    needs: test-connection
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Create test Python script
        run: |
          cat > test_netbird.py << 'EOF'
          #!/usr/bin/env python3
          import subprocess
          import os
          
          setup_key = os.environ.get('NETBIRD_SETUP_KEY')
          if setup_key:
              print("🔗 Connecting to NetBird...")
              subprocess.run(['sudo', 'netbird', 'up', '--setup-key', setup_key], check=False)
              print("📊 Network status:")
              subprocess.run(['sudo', 'netbird', 'status'])
          else:
              print("⚠️ No NETBIRD_SETUP_KEY found")
          
          print("✅ Python application ready")
          EOF
          chmod +x test_netbird.py
      
      - name: Run Python NetBird test
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          # Install NetBird for Python test
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update -y
          sudo apt-get install -y netbird
          
          # Run Python test
          python3 test_netbird.py

  container-build:
    runs-on: ubuntu-latest
    needs: test-connection
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM python:3.12-slim
          
          RUN apt-get update && apt-get install -y \
              curl \
              gnupg \
              ca-certificates \
              && curl -sSL https://pkgs.netbird.io/debian/public.key | gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg \
              && echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | tee /etc/apt/sources.list.d/netbird.list \
              && apt-get update && apt-get install -y netbird \
              && apt-get clean
          
          WORKDIR /app
          CMD ["python3", "-c", "import subprocess; subprocess.run(['netbird', 'status'])"]
          EOF
      
      - name: Build Docker container
        run: |
          docker build -t python-netbird:latest .
          
      - name: Test Docker container
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          docker run --rm \
            -e NETBIRD_SETUP_KEY=$NETBIRD_SETUP_KEY \
            python-netbird:latest \
            bash -c "netbird up --setup-key \$NETBIRD_SETUP_KEY && netbird status"
