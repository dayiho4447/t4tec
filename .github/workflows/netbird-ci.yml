name: NetBird CI Pipeline (Manual Container)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NetBird
        run: |
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | tee /etc/apt/sources.list.d/netbird.list
          apt-get update -y
          apt-get install -y netbird

      - name: Start NetBird Daemon Manually
        run: |
          # The daemon must be started manually in a container without systemd
          netbird service install
          netbird service start
          sleep 3 # Give the daemon a moment to initialize

      - name: Connect to NetBird
        env:
          NETBIRD_SETUP_KEY: 63C5CBB7-500A-4458-BB3E-7C2BB0806DF4
        run: |
          netbird up --setup-key $NETBIRD_SETUP_KEY

      - name: Check connection status
        run: |
          netbird status
