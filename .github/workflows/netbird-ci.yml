name: NetBird Persistent Runner

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  netbird-runner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =============================================
      # Install NetBird
      # =============================================
      - name: Install NetBird
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update -y
          sudo apt-get install -y netbird

      # =============================================
      # Connect NetBird
      # =============================================
      - name: Connect NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          sudo netbird up --setup-key $NETBIRD_SETUP_KEY --allow-server-ssh &
          sleep 5
          echo "✅ NetBird connected!"
          sudo netbird status

      # =============================================
      # Setup SSH (port 22, root/root)
      # =============================================
      - name: Setup SSH
        run: |
          sudo apt-get install -y openssh-server
          echo "root:root" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          echo "✅ SSH enabled (root/root)"

      # =============================================
      # Setup VNC with x11vnc and Xvfb (RELIABLE)
      # =============================================
      - name: Install VNC packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            x11vnc \
            xvfb \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-utils \
            xauth
          echo "✅ VNC packages installed"

      - name: Start Virtual Display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          echo "✅ Virtual display :99 created"

      - name: Start Desktop Environment
        run: |
          export DISPLAY=:99
          export XDG_CURRENT_DESKTOP="XFCE"
          export XDG_CONFIG_DIRS="/etc/xdg/xfce4:/etc/xdg"
          export XDG_DATA_DIRS="/usr/share/xfce4:/usr/share"
          
          # Start session dbus
          dbus-daemon --session --fork &
          sleep 2
          
          # Start XFCE
          startxfce4 &
          sleep 5
          echo "✅ Desktop environment started"

      - name: Start x11vnc Server
        run: |
          export DISPLAY=:99
          x11vnc -display :99 -forever -nopw -passwd root -shared -listen 0.0.0.0 &
          sleep 3
          echo "✅ x11vnc started on port 5900"

      - name: Verify VNC
        run: |
          echo "Running processes:"
          ps aux | grep -E "Xvfb|x11vnc|xfce|dbus" | grep -v grep
          echo ""
          echo "Port 5900:"
          netstat -tlnp 2>/dev/null | grep 5900 || echo "⚠️ Port 5900 not found, checking all ports..."
          netstat -tlnp 2>/dev/null | grep -E "5900|5901|5902" || echo "No VNC ports found"

      # =============================================
      # Alternative: Simple VNC with x11vnc and xterm
      # =============================================
      - name: Start Simple VNC Fallback
        if: failure()
        run: |
          export DISPLAY=:99
          # Kill any existing
          pkill -f Xvfb || true
          pkill -f x11vnc || true
          
          # Start with xterm only
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          DISPLAY=:99 xterm &
          sleep 2
          x11vnc -display :99 -forever -nopw -passwd root -shared -listen 0.0.0.0 &
          sleep 3
          echo "✅ Simple VNC started on port 5900"

      # =============================================
      # Show connection info
      # =============================================
      - name: Connection Info
        run: |
          NETBIRD_IP=$(sudo netbird status | grep "NetBird IP" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          
          echo "=========================================="
          echo "🔗 NETBIRD RUNNER READY"
          echo "=========================================="
          echo ""
          sudo netbird status
          echo ""
          echo "📡 NetBird IP: $NETBIRD_IP"
          echo ""
          echo "🔑 SSH (port 22):"
          echo "  ssh root@$NETBIRD_IP"
          echo "  Password: root"
          echo ""
          echo "🖥️ VNC (port 5900):"
          echo "  vncviewer $NETBIRD_IP:5900"
          echo "  Password: root"
          echo "=========================================="
          echo ""
          echo "⏳ Runner stays alive for 60 minutes"

      - name: Keep Alive (60 minutes)
        run: |
          echo "⏳ Runner is alive! SSH and VNC available."
          echo ""
          for i in {1..12}; do
            echo "⏰ Alive: $((i*5)) minutes"
            sleep 300
          done
          echo "⏰ 60 minute timeout reached. Shutting down..."

      # =============================================
      # Cleanup
      # =============================================
      - name: Cleanup
        if: always()
        run: |
          pkill -f Xvfb || true
          pkill -f x11vnc || true
          pkill -f startxfce4 || true
          sudo netbird down || true
          echo "🧹 Cleanup complete"
