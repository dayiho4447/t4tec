name: NetBird Persistent Runner

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  netbird-runner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =============================================
      # Install NetBird
      # =============================================
      - name: Install NetBird
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update -y
          sudo apt-get install -y netbird

      # =============================================
      # Connect NetBird
      # =============================================
      - name: Connect NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          sudo netbird up --setup-key $NETBIRD_SETUP_KEY --allow-server-ssh &
          sleep 5
          echo "✅ NetBird connected!"
          sudo netbird status

      # =============================================
      # Setup SSH (port 22, root/root)
      # =============================================
      - name: Setup SSH
        run: |
          sudo apt-get install -y openssh-server
          echo "root:root" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          echo "✅ SSH enabled (root/root)"

      # =============================================
      # Setup TigerVNC with XFCE (port 5901)
      # =============================================
      - name: Install VNC and Desktop
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            tigervnc-standalone-server \
            tigervnc-common \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-utils \
            xauth
          echo "✅ VNC packages installed"

      - name: Configure VNC
        run: |
          mkdir -p ~/.vnc
          echo "root" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

      - name: Create VNC startup script with XFCE
        run: |
          cat > ~/.vnc/xstartup << 'EOF'
          #!/bin/sh
          export XKL_XMODMAP_DISABLE=1
          export XDG_CURRENT_DESKTOP="XFCE"
          export XDG_MENU_PREFIX="xfce-"
          export XDG_CONFIG_DIRS="/etc/xdg/xfce4:/etc/xdg"
          export XDG_DATA_DIRS="/usr/share/xfce4:/usr/share"
          export DISPLAY=:1
          
          [ -x /etc/vnc/xstartup ] && exec /etc/vnc/xstartup
          [ -r $HOME/.Xresources ] && xrdb $HOME/.Xresources
          
          # Start XFCE
          startxfce4 &
          EOF
          chmod +x ~/.vnc/xstartup

      - name: Start VNC Server
        run: |
          # Kill any existing session
          vncserver -kill :1 || true
          
          # Start VNC with XFCE
          vncserver :1 -geometry 1920x1080 -depth 24 -localhost no
          
          # Verify it's running
          sleep 3
          if pgrep -f "Xtigervnc.*:1"; then
            echo "✅ VNC running on display :1 (port 5901)"
          else
            echo "⚠️ VNC failed, trying fallback..."
            vncserver -kill :1 || true
            # Fallback: just xterm
            cat > ~/.vnc/xstartup << 'EOF'
            #!/bin/sh
            xterm &
            EOF
            chmod +x ~/.vnc/xstartup
            vncserver :1 -geometry 1920x1080 -depth 24 -localhost no
          fi

      - name: Verify VNC
        run: |
          echo "VNC Processes:"
          ps aux | grep -E "vnc|Xvnc|Xtigervnc" | grep -v grep || echo "⚠️ No VNC process"
          echo ""
          echo "VNC Log (last 20 lines):"
          tail -20 ~/.vnc/*.log 2>/dev/null || echo "No log found"
          echo ""
          netstat -tlnp 2>/dev/null | grep 5901 || echo "⚠️ Port 5901 not listening"

      # =============================================
      # Show connection info
      # =============================================
      - name: Connection Info
        run: |
          NETBIRD_IP=$(sudo netbird status | grep "NetBird IP" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          
          echo "=========================================="
          echo "🔗 NETBIRD RUNNER READY"
          echo "=========================================="
          echo ""
          sudo netbird status
          echo ""
          echo "📡 NetBird IP: $NETBIRD_IP"
          echo ""
          echo "🔑 SSH (port 22):"
          echo "  ssh root@$NETBIRD_IP"
          echo "  Password: root"
          echo ""
          echo "🖥️ VNC (port 5901):"
          echo "  vncviewer $NETBIRD_IP:1"
          echo "  Password: root"
          echo "=========================================="
          echo ""
          echo "⏳ Runner stays alive for 60 minutes"

      - name: Keep Alive (60 minutes)
        run: |
          echo "⏳ Runner is alive! Press Ctrl+C to stop, or wait 60 minutes."
          echo ""
          for i in {1..12}; do
            echo "⏰ Alive: $((i*5)) minutes"
            sleep 300
          done
          echo "⏰ 60 minute timeout reached. Shutting down..."

      # =============================================
      # Cleanup
      # =============================================
      - name: Cleanup
        if: always()
        run: |
          vncserver -kill :1 || true
          sudo netbird down || true
          echo "🧹 Cleanup complete"
