name: NetBird Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Test NetBird connection on GitHub runner
  test-connection:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update package list
        run: sudo apt-get update -y

      - name: Install prerequisites
        run: |
          sudo apt-get install -y ca-certificates curl gnupg

      - name: Add NetBird APT repository
        run: |
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list

      - name: Install NetBird client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netbird

      - name: Connect to NetBird network
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          sudo netbird up --setup-key $NETBIRD_SETUP_KEY &
          sleep 5

      - name: Check connection status
        run: sudo netbird status

      - name: Verify Python is available
        run: |
          python3 --version
          echo "✅ Python environment ready"

  # Job 2: Build Python container with NetBird (using static binary only - FIXED)
  container-build:
    runs-on: ubuntu-latest
    needs: test-connection
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create Dockerfile with NetBird static binary
        run: |
          cat > Dockerfile << 'EOF'
          FROM python:3.12-slim
          
          # Download NetBird static binary directly (no APT issues)
          RUN apt-get update && apt-get install -y curl && \
              curl -L https://github.com/netbirdio/netbird/releases/latest/download/netbird-linux-amd64 -o /usr/local/bin/netbird && \
              chmod +x /usr/local/bin/netbird && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/*
          
          # Create /app directory
          RUN mkdir -p /app
          
          # Create Python app
          RUN echo '#!/usr/bin/env python3' > /app/app.py && \
              echo 'import subprocess' >> /app/app.py && \
              echo 'import os' >> /app/app.py && \
              echo 'import time' >> /app/app.py && \
              echo '' >> /app/app.py && \
              echo 'def connect_netbird():' >> /app/app.py && \
              echo '    setup_key = os.environ.get("NETBIRD_SETUP_KEY")' >> /app/app.py && \
              echo '    if setup_key:' >> /app/app.py && \
              echo '        print("🔗 Connecting to NetBird...")' >> /app/app.py && \
              echo '        subprocess.run(["/usr/local/bin/netbird", "up", "--setup-key", setup_key], check=False)' >> /app/app.py && \
              echo '        time.sleep(3)' >> /app/app.py && \
              echo '        subprocess.run(["/usr/local/bin/netbird", "status"])' >> /app/app.py && \
              echo '    else:' >> /app/app.py && \
              echo '        print("⚠️ No NETBIRD_SETUP_KEY found")' >> /app/app.py && \
              echo '' >> /app/app.py && \
              echo 'if __name__ == "__main__":' >> /app/app.py && \
              echo '    print("🐍 Python container with NetBird")' >> /app/app.py && \
              echo '    print("=" * 40)' >> /app/app.py && \
              echo '    connect_netbird()' >> /app/app.py && \
              echo '    print("✅ Application is running")' >> /app/app.py
          
          WORKDIR /app
          CMD ["python3", "/app/app.py"]
          EOF
      
      - name: Build Docker container
        run: |
          docker build -t python-netbird:latest .
      
      - name: Test Docker container with NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          docker run --rm \
            -e NETBIRD_SETUP_KEY=$NETBIRD_SETUP_KEY \
            python-netbird:latest

  # Job 3: Alternative - Use pre-built NetBird Docker image
  prebuilt-container:
    runs-on: ubuntu-latest
    needs: test-connection
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create Dockerfile using pre-built NetBird
        run: |
          cat > Dockerfile.prebuilt << 'EOF'
          # Use official NetBird image as base
          FROM netbirdio/netbird:latest AS netbird
          
          # Use Python image
          FROM python:3.12-slim
          
          # Copy NetBird binary from official image
          COPY --from=netbird /usr/bin/netbird /usr/local/bin/netbird
          
          # Create /app directory
          RUN mkdir -p /app
          
          # Create Python app
          RUN echo '#!/usr/bin/env python3' > /app/app.py && \
              echo 'import subprocess' >> /app/app.py && \
              echo 'import os' >> /app/app.py && \
              echo 'import time' >> /app/app.py && \
              echo '' >> /app/app.py && \
              echo 'def connect_netbird():' >> /app/app.py && \
              echo '    setup_key = os.environ.get("NETBIRD_SETUP_KEY")' >> /app/app.py && \
              echo '    if setup_key:' >> /app/app.py && \
              echo '        print("🔗 Connecting to NetBird...")' >> /app/app.py && \
              echo '        subprocess.run(["/usr/local/bin/netbird", "up", "--setup-key", setup_key], check=False)' >> /app/app.py && \
              echo '        time.sleep(3)' >> /app/app.py && \
              echo '        subprocess.run(["/usr/local/bin/netbird", "status"])' >> /app/app.py && \
              echo '    else:' >> /app/app.py && \
              echo '        print("⚠️ No NETBIRD_SETUP_KEY found")' >> /app/app.py && \
              echo '' >> /app/app.py && \
              echo 'if __name__ == "__main__":' >> /app/app.py && \
              echo '    print("🐍 Python container with NetBird (pre-built)")' >> /app/app.py && \
              echo '    print("=" * 40)' >> /app/app.py && \
              echo '    connect_netbird()' >> /app/app.py && \
              echo '    print("✅ Application is running")' >> /app/app.py
          
          WORKDIR /app
          CMD ["python3", "/app/app.py"]
          EOF
      
      - name: Build pre-built container
        run: |
          docker build -f Dockerfile.prebuilt -t python-netbird-prebuilt:latest .
      
      - name: Test pre-built container
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          docker run --rm \
            -e NETBIRD_SETUP_KEY=$NETBIRD_SETUP_KEY \
            python-netbird-prebuilt:latest

  # Job 4: Python script test on GitHub runner
  python-script-test:
    runs-on: ubuntu-latest
    needs: test-connection
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install NetBird on runner
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update -y
          sudo apt-get install -y netbird
      
      - name: Create Python test script
        run: |
          cat > test_netbird.py << 'EOF'
          #!/usr/bin/env python3
          import subprocess
          import os
          import time
          
          def connect_netbird():
              setup_key = os.environ.get('NETBIRD_SETUP_KEY')
              if setup_key:
                  print("🔗 Connecting to NetBird...")
                  subprocess.run(['sudo', 'netbird', 'up', '--setup-key', setup_key], check=False)
                  time.sleep(3)
                  print("📊 Network status:")
                  subprocess.run(['sudo', 'netbird', 'status'])
              else:
                  print("⚠️ No NETBIRD_SETUP_KEY found")
          
          if __name__ == "__main__":
              print("🐍 Testing NetBird with Python")
              print("=" * 40)
              connect_netbird()
              print("✅ Python script completed successfully")
          EOF
          chmod +x test_netbird.py
      
      - name: Run Python test
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          python3 test_netbird.py
