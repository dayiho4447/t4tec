name: Persistent Ubuntu VPS with NetBird

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  ubuntu-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # =============================================
      # Install NetBird
      # =============================================
      - name: Install NetBird
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update -y
          sudo apt-get install -y netbird

      # =============================================
      # Start NetBird as PERSISTENT SERVICE
      # =============================================
      - name: Start NetBird Service
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          # Start NetBird as background service
          sudo netbird up --setup-key $NETBIRD_SETUP_KEY --allow-server-ssh
          sleep 5
          echo "✅ NetBird running as service"
          sudo netbird status

      # =============================================
      # Setup SSH (root/root login)
      # =============================================
      - name: Setup SSH
        run: |
          sudo apt-get install -y openssh-server
          echo "root:root" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          echo "✅ SSH enabled (root/root)"

      # =============================================
      # Setup xRDP (Remote Desktop)
      # =============================================
      - name: Install xRDP and Desktop
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xrdp \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            xorg \
            x11-utils
          echo "✅ xRDP installed"

      - name: Configure xRDP for XFCE
        run: |
          # Set XFCE as default session
          echo "xfce4-session" > ~/.xsession
          echo "startxfce4" > ~/.xsessionrc
          
          # Configure xrdp to use XFCE
          sudo sed -i 's/exec startxfce4/exec startxfce4/' /etc/xrdp/startwm.sh || \
          echo "startxfce4" | sudo tee -a /etc/xrdp/startwm.sh
          
          # Restart xrdp
          sudo systemctl restart xrdp
          echo "✅ xRDP configured"

      - name: Create user for RDP
        run: |
          # Create a regular user for RDP (root not recommended)
          sudo useradd -m -s /bin/bash rdpuser || true
          echo "rdpuser:root" | sudo chpasswd
          sudo usermod -aG sudo rdpuser
          echo "✅ RDP user created: rdpuser/root"

      # =============================================
      # Show connection info
      # =============================================
      - name: Connection Info
        run: |
          NETBIRD_IP=$(sudo netbird status | grep "NetBird IP" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "=========================================="
          echo "🔗 PERSISTENT UBUNTU VPS READY"
          echo "=========================================="
          echo ""
          echo "📡 NetBird IP: $NETBIRD_IP"
          echo ""
          echo "🔑 SSH (port 22):"
          echo "  ssh root@$NETBIRD_IP"
          echo "  Password: root"
          echo ""
          echo "🖥️ xRDP (Remote Desktop - port 3389):"
          echo "  Use Windows Remote Desktop or any RDP client"
          echo "  Address: $NETBIRD_IP:3389"
          echo "  User: rdpuser"
          echo "  Password: root"
          echo ""
          echo "🔑 NetBird SSH (port 44338):"
          echo "  ssh -p 44338 root@$NETBIRD_IP"
          echo "  Password: root"
          echo "=========================================="
          echo ""
          echo "⏳ Server runs for 6 hours max"
          echo "   IP stays same until restart"

      # =============================================
      # KEEP RUNNING - REAL PERSISTENT SERVER
      # =============================================
      - name: Keep Running (6 hours)
        run: |
          echo "=========================================="
          echo "🚀 SERVER IS RUNNING! (6 HOURS MAX)"
          echo "=========================================="
          echo ""
          echo "Connect via:"
          echo "  SSH: ssh root@$(sudo netbird status | grep 'NetBird IP' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "  RDP: Windows Remote Desktop to $(sudo netbird status | grep 'NetBird IP' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1):3389"
          echo ""
          echo "NetBird will stay connected. This is a REAL server."
          echo ""
          
          # Keep alive for 6 hours (GitHub max)
          for i in {1..360}; do
            sleep 60
            # Show status every 10 minutes
            if [ $((i % 10)) -eq 0 ]; then
              echo "⏰ Server alive: $((i/60)) hours, $((i%60)) minutes"
              # Keep NetBird alive
              sudo netbird status > /dev/null 2>&1 || sudo netbird up --setup-key ${{ secrets.NETBIRD_SETUP_KEY }} --allow-server-ssh
            fi
          done
          
          echo "⏰ 6 hour timeout reached. Server shutting down..."

      # =============================================
      # Cleanup
      # =============================================
      - name: Cleanup
        if: always()
        run: |
          sudo netbird down || true
          echo "🧹 Cleanup complete"
